# MySQL配置（hadoop102的数据库）
spring:
  datasource:
    url: jdbc:mysql://hadoop102:3306/ha_device_log?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# Redis配置（hadoop103的Redis）
redis:
  host: hadoop103
  port: 6379
  password: 123456
  database: 0
  timeout: 3000
  pool:
    maxTotal: 30
    maxIdle: 15
    minIdle: 5
    maxWaitMillis: 5000

# HDFS配置（适配HdfsToKafkaConfig读取api_log.txt）
hdfs:
  namenode:
    rpc-address: hadoop102:8020
  user: atguigu
  file-path: hdfs://hadoop102:8020/flink/api_log.txt
  retry:
    count: 3
    interval: 2000

# Kafka配置（适配生产者与Flink消费者）
kafka:
  bootstrap-servers: hadoop102:9092,hadoop103:9092,hadoop104:9092
  topic:
    api-log: api_log_topic
  producer:
    batch-size: 32768
    linger-ms: 20
    compression-type: snappy
  consumer:
    group-id: flink-api-log-group
    auto-offset-reset: earliest

# Flink实时计算配置
flink:
  window:
    size: 10000
    slide: 5000
  checkpoint:
    enabled: true
    interval: 60000
  kafka-connector:
    offset-commit-interval: 5000
    fetch-max-bytes: 5242880
    session-timeout: 30000

# HTTP服务配置
http:
  port: 8080
  host: 0.0.0.0
  realtime:
    data-route: /api/realtime/data
    circuit-breaker-route: /api/realtime/circuit-breaker
    normal-interfaces-route: /api/realtime/normal-interfaces

# 日志解析配置（适配Job类数据处理）
log:
  delimiter: "\t"
  skip-header: true
  fields:
    count: 5
  response-time:
    unit: ms

# 业务配置
biz:
  realtime-ranking-key: interface_error_rate_ranking
  circuit-breaker-threshold: 0.05
  interface-count: 15
  monitor:
    error-rate:
      warn-threshold: 0.03
      alert:
        enabled: true
        receivers: tech-team@xxx.com
        interval: 300000