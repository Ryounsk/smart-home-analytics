# MySQL配置（hadoop102的数据库）
spring:
  datasource:
    url: jdbc:mysql://hadoop102:3306/ha_device_log?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# Redis配置（hadoop103的Redis）
redis:
  host: hadoop103
  port: 6379
  password: 123456
  database: 0
  timeout: 3000  # 连接超时
  pool:
    maxTotal: 30   # 最大连接数
    maxIdle: 15    # 最大空闲连接
    minIdle: 5     # 最小空闲连接
    maxWaitMillis: 5000  # 最大等待时间

# Flink实时计算配置
flink:
  window:
    size: 60000  # 窗口大小
    slide: 30000  # 滑动步长
  checkpoint:
    enabled: true
    interval: 60000  # 1分钟Checkpoint

# HTTP服务配置
http:
  port: 8080  # 路由端口
  host: 0.0.0.0  # 允许集群外访问
  realtime:
    data-route: /api/realtime/data  # 实时状态路由
    circuit-breaker-route: /api/realtime/circuit-breaker  # 熔断接口路由
    normal-interfaces-route: /api/realtime/normal-interfaces  # 健康接口路由

# 业务配置
biz:
  realtime-ranking-key: interface_error_rate_ranking  # 实时错误率排行榜Redis键
  circuit-breaker-threshold: 0.05  # 熔断阈值（5%）
  interface-count: 15  # 返回15个接口